<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title></title>
    <style type="text/css">tr.plain a {
      color: #00589f!important;}
      .part_admissions ul {
      list-style: none;}
    </style>
  </head>
  <body>
    <div style="margin-top: 10px;">
      <div class="part_admissions" id="part_admissions">
        <h3>
          Admissions Letters
        </h3>

        <table>
          <tbody>
          </tbody>
          <colgroup>
            <col />
            <col />
            <col />
          </colgroup>
          <tbody>
            <tr>
              <th style="width: 15%;">Status</th>
              <th style="width: 70%;">Letter Name</th>
              <th style="width: 15%;">Date</th>
            </tr>
            {% for letters in decisionletters %}
            <tr>
              <td>{% if {{letters.status}} != 'Received' %}<img alt="" height="22" src="/icons/awaiting.png" title="Status: Awaiting" width="22" />{% else %}<img alt="" height="22" src="/icons/received.png" title="Status: {{letters.status}}" width="22" />{% endif %}</td>
              <td>{% if {{letters.url}} == null %}{{letters.subject}}{% else %}<a href="{{letters.url}}" target="_blank">{{letters.subject}}</a>{% endif %}</td>
              <td>{{letters.date}}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
