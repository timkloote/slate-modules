<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title></title>
  </head>
  <body>
    <div class="enrollment-overview" id="part_admissions">
      <p class="enrollment-overview__eyebrow">Your next chapter</p>
      <h3>Your enrollment</h3>
      <p class="enrollment-overview__intro">Review your deposit details and take your next steps toward joining Northeastern.</p>
      <div class="enrollment-overview__grid">
        <div class="enrollment-overview__deposit">
          <h4>Deposit details</h4>
          <dl>
            <div><dt>Deposit status</dt><dd>{{deposit_status}}</dd></div>
            <div><dt>Deposit deadline</dt><dd>{{deposit_deadline}}</dd></div>
          </dl>
        </div>
        <div class="enrollment-overview__actions">
          <h4>Next steps</h4>
          <p><a class="arrow-link" href="https://enroll.northeastern.edu/register/?id=e29f389c-be88-4d55-896f-a44524268017" target="_blank">Complete your accepted student survey</a></p>
          <p><a class="arrow-link" href="https://enroll.northeastern.edu/apply/form?id=216aaec1-c3b9-4838-8d98-7c7eec429275" target="_blank">Request a deadline extension</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
