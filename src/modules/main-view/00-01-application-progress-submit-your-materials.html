<html xmlns="http://www.w3.org/1999/xhtml">

    <h2>Track Your Application</h2>
    <table aria-label="Application progress" cellpadding="0" cellspacing="0">
      <tbody>
        <tr>
          <td class="current" aria-current="step" aria-label="Submit Your Materials: Current step"><strong>Submit Your Materials</strong></td>
          <td class="not_current" aria-label="Application Under Review: Upcoming"><strong>Application Under Review</strong></td>
          <td class="not_current" aria-label="Decision Available: Upcoming"><strong>Decision Available</strong></td>
        </tr>
      </tbody>
    </table>
    <p>Thank you for submitting your application. View your checklist for any materials still needed.</p>
  </body>
</html>
