<html xmlns="http://www.w3.org/1999/xhtml">
  <head><title></title></head>
  <body>
    <h2>Track Your Application</h2>
    <table aria-label="Application progress" cellpadding="0" cellspacing="0">
      <tbody>
        <tr>
          <td class="complete" aria-label="Submit Your Materials: Completed"><strong>Submit Your Materials</strong></td>
          <td class="complete" aria-label="Application Under Review: Completed"><strong>Application Under Review</strong></td>
          <td class="current" aria-current="step" aria-label="Decision Available: Current step"><strong>Decision Available</strong></td>
        </tr>
      </tbody>
    </table>
    <p>Your application review is complete. You can now view your decision.</p>
  </body>
</html>
