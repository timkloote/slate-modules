<!--
Module: 55. Application Selector
Proposed Slate class names: col-right has-js application-selector
-->
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title></title>
  </head>
  <body>
    <div>
      <h3>
        Check Other Applications
      </h3>
      <select autocomplete="off" data-onchange="{ init: false }" id="apps" onchange="FW.Navigate('/apply/?id=' + $(this).val() + '&amp;r=status');"><option value="">Select another application</option>{% for result in {{apps}} %}<option value="{{result.guid}}">{% if {{global_pathway}} == 'Y' %}Global Pathway{% else %}{{result.program}}{% endif %}{% if {{result.college}} == 'College of Engineering' %} - {{result.concentration}}{% endif %} - {{result.campus}} ({{result.term}})</option>{% endfor %}</select>
    </div>
    <script>
      $(document).ready(function () {
        const applicationSelect = document.querySelector("#apps");
        const program = {{program}};

        $(applicationSelect.selectedOptions[0]).html(program);
      });
    </script>
  </body>
</html>
