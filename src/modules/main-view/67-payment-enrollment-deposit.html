<!--
Module: 67. Payment - Enrollment Deposit
Proposed Slate class names: col-left payment-block
-->
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title></title>
  </head>
  <body>
    <div>
      <h3 class="payment_sum">
        Payment Due{% if {{payment_due_date}} != null and {{payment_due_date}} != '' %} by {{payment_due_date}}{% endif %}: {{payment_sum}} {{payment_currency}}
      </h3>

      <table class="nohighlight payment-block__table">
        <colgroup>
          <col/>
          <col/>
          <col />
        </colgroup>
        <tbody>
          <tr>
            <td><img alt="Status: Awaiting" height="22" src="/icons/awaiting.png" width="22" /></td>
            <td>Awaiting</td>
            <td>Enrollment Deposit - <a href="/apply/payment?id={{payment_guid}}">Submit Payment for {{payment_sum}} {{payment_currency}}</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
